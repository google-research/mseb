name: Unittests & Auto-publish

# Allow to trigger the workflow manually (e.g. when deps changes)
on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: "Core"
            extras: "dev"
            marker: "not optional"

          - name: "Whisper"
            extras: "dev,whisper"
            marker: "whisper"

          - name: "Scann"
            extras: "dev,scann"
            marker: "scann"

          - name: "Segmentation"
            extras: "dev,spacy"
            marker: "segmentation"

          - name: "Embedding"
            extras: "dev,scann,sentence-transformers"
            marker: "embedding"

    name: Pytest (${{ matrix.name }})

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        # cache: pip
        # cache-dependency-path: '**/pyproject.toml'

    - run: pip --version
    # Pre-install cpu torch deps.
    - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu

    - name: Install dependencies for ${{ matrix.name }}
      run: pip install -e .[${{ matrix.extras }}]

    - run: pip freeze

    - name: Run ${{ matrix.name }} tests
      run: pytest -vv -n auto -m '${{ matrix.marker }}'

  pytest-job:
    needs: run-tests
    runs-on: ubuntu-latest

    steps:
    - name: All tests passed
      run: echo "Test matrix completed successfully."

  publish-job:
    # Only try to publish if:
    # * Repo is self (prevents running from forks)
    # * Branch is `main`
    if: |
      github.repository == 'google-research/mseb'
      && github.ref == 'refs/heads/main'
    needs: pytest-job  # Only publish after tests are successful
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - name: Check version and build if new
      id: check_version
      run: |
        python -m pip install --upgrade pip build twine packaging
        python -m build
        LOCAL_VER=$(python -c "import glob, os; whl=glob.glob('dist/*.whl')[0]; print(os.path.basename(whl).split('-')[1])")
        PYPI_VER=$(python -c "import json, urllib.request; print(json.loads(urllib.request.urlopen('https://pypi.org/pypi/mseb/json').read())['info']['version'])")
        echo "Local: $LOCAL_VER, PyPI: $PYPI_VER"
        if LOCAL_VER="${LOCAL_VER}" PYPI_VER="${PYPI_VER}" python -c "import os; from packaging.version import Version; raise SystemExit(0 if Version(os.environ['LOCAL_VER']) > Version(os.environ['PYPI_VER']) else 1)"; then
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Authenticate to Google Cloud (OSS Exit Gate)
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
    - name: Set up Cloud SDK
      if: steps.check_version.outputs.should_publish == 'true'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    - name: Clean up prior failed staging attempt for this exact version (if any)
      if: steps.check_version.outputs.should_publish == 'true'
      run: |
        set -euo pipefail
        python - <<'PY'
        import email, glob, os, re, subprocess, sys, tarfile, zipfile
        seen = set()
        for path in sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz")):
          if path.endswith(".whl"):
            with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                if name.endswith(".dist-info/METADATA"):
                  msg = email.message_from_bytes(zf.read(name))
                  pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                  seen.add((pkg, msg["Version"].strip()))
                  break
          elif path.endswith(".tar.gz"):
            with tarfile.open(path, "r:gz") as tf:
              for member in tf.getmembers():
                if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                  fh = tf.extractfile(member)
                  if fh is not None:
                    msg = email.message_from_bytes(fh.read())
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    seen.add((pkg, msg["Version"].strip()))
                  break
        if not seen:
          raise SystemExit("ERROR: No .whl/.tar.gz metadata found under dist/")
        for pkg, ver in sorted(seen):
          desc = subprocess.run([
              "gcloud", "artifacts", "versions", "describe", ver,
              f"--package={pkg}", "--project=oss-exit-gate-prod",
              "--location=us", "--repository=mseb--pypi", "--format=value(name)",
          ], capture_output=True, text=True)
          if desc.returncode == 0:
            print(f"Deleting prior staged attempt: {pkg}@{ver}")
            subprocess.run([
                "gcloud", "artifacts", "versions", "delete", ver,
                f"--package={pkg}", "--project=oss-exit-gate-prod",
                "--location=us", "--repository=mseb--pypi", "--quiet",
            ], check=True)
          elif not re.search(r"NOT_FOUND|not found|404", desc.stderr, re.I):
            sys.stderr.write(desc.stderr)
            raise SystemExit(desc.returncode)
        PY
    - name: Stage to OSS Exit Gate and upload manifest
      if: steps.check_version.outputs.should_publish == 'true'
      env:
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set -euo pipefail
        TWINE_PASSWORD="$(gcloud auth print-access-token)"
        echo "::add-mask::${TWINE_PASSWORD}"
        TWINE_USERNAME="oauth2accesstoken"
        export TWINE_USERNAME TWINE_PASSWORD
        python -m twine upload \
          --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/mseb--pypi/" \
          dist/*
        unset TWINE_USERNAME TWINE_PASSWORD
        MANIFEST_PATH="${RUNNER_TEMP}/manifest-mseb.json"
        python - "${MANIFEST_PATH}" <<'PY'
        import email, glob, json, re, sys, tarfile, zipfile
        pairs = set()
        for path in sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz")):
          if path.endswith(".whl"):
            with zipfile.ZipFile(path) as zf:
              for name in zf.namelist():
                if name.endswith(".dist-info/METADATA"):
                  msg = email.message_from_bytes(zf.read(name))
                  pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                  pairs.add((pkg, msg["Version"].strip()))
                  break
          elif path.endswith(".tar.gz"):
            with tarfile.open(path, "r:gz") as tf:
              for member in tf.getmembers():
                if member.name.endswith("/PKG-INFO") and member.name.count("/") == 1:
                  fh = tf.extractfile(member)
                  if fh is not None:
                    msg = email.message_from_bytes(fh.read())
                    pkg = re.sub(r"[-_.]+", "-", msg["Name"].strip()).lower()
                    pairs.add((pkg, msg["Version"].strip()))
                  break
        if not pairs:
          raise SystemExit("ERROR: No .whl/.tar.gz metadata found under dist/ for manifest")
        manifest = {
            "publish_all": False,
            "publishing_groups": [{
                "packages": [{"name": pkg, "version": ver} for pkg, ver in sorted(pairs)]
            }],
        }
        with open(sys.argv[1], "w", encoding="utf-8") as fh:
          json.dump(manifest, fh, indent=2)
          fh.write("\n")
        PY
        gcloud storage cp "${MANIFEST_PATH}" \
          "gs://oss-exit-gate-prod-projects-bucket/mseb/pypi/manifests/manifest-${RUN_ID}-${RUN_ATTEMPT}.json"
        rm -f "${MANIFEST_PATH}"
